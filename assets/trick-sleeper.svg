<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
  <title id="t1">Diagram of the Sleeper trick: the yoyo spins in place at the end of the string</title>
  <rect width="400" height="400" fill="#1C2142"/>
  <path d="M200 40 L200 220" stroke="#F4B740" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="40" r="6" fill="#F4B740"/>
  <ellipse cx="200" cy="230" rx="120" ry="22" fill="none" stroke="#F4B740" stroke-width="2" stroke-dasharray="3 9" opacity="0.6"/>
  <g transform="translate(200,230)">
    <circle cx="-5" cy="5" r="86" fill="#7A1F17"/>
    <circle cx="0" cy="0" r="86" fill="#FF6B57" stroke="#2A1512" stroke-width="5"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#F4B740" stroke-width="5"/>
    <circle cx="0" cy="0" r="12" fill="#2A1512"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="Space Mono, monospace" font-size="20" fill="#EDEFF7">Sleeper</text>
</svg>
